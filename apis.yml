description: QuantumScape is a battery technology company developing next-generation solid-state
  lithium-metal batteries for electric vehicles and energy storage. Its anode-free cell design aims to
  deliver greater energy density, faster charging, longer life, and improved safety versus conventional
  lithium-ion cells, while simplifying manufacturing and lowering cost. The company was surfaced as a
  portfolio company of Khosla Ventures and Lightspeed Venture Partners and added to the API Evangelist
  network. It publishes a corporate website, blog, and investor relations resources but no public
  developer API, SDK, or developer portal.
